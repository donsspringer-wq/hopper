<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e100c">
<title>Hopper Garden Crossing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Saira+Stencil+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-l">
      <div id="locName">GARDEN CROSSING</div>
      <div id="roundTag">SOLO RUN</div>
    </div>
    <div class="hud-c">
      <div id="timer">0.0</div>
      <div id="posTag">&nbsp;</div>
    </div>
    <div class="hud-r">
      <div id="lives" aria-label="Lives"></div>
      <button id="mute" type="button" aria-label="Toggle sound">SND</button>
    </div>
  </header>

  <main id="stage">
    <canvas id="cv" aria-label="Hopper game field"></canvas>
    <div id="banner" aria-live="polite"></div>
  </main>

  <footer id="pad">
    <button class="dp up" data-dx="0" data-dy="-1" aria-label="Hop forward"><i></i></button>
    <button class="dp left" data-dx="-1" data-dy="0" aria-label="Hop left"><i></i></button>
    <button class="dp down" data-dx="0" data-dy="1" aria-label="Hop back"><i></i></button>
    <button class="dp right" data-dx="1" data-dy="0" aria-label="Hop right"><i></i></button>
  </footer>

  <section id="menu" class="screen">
    <div class="panel">
      <div class="logo">
        <h1>HOPPER</h1>
        <p class="sub">GARDEN CROSSING</p>
      </div>
      <div class="hazard"></div>
      <label class="field" for="callsign">CALLSIGN</label>
      <input id="callsign" type="text" maxlength="14" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="YOUR NAME">
      <div class="field">BANDANA</div>
      <div id="swatches" role="radiogroup" aria-label="Bandana color"></div>
      <button id="btnQuick" class="btn primary" type="button">QUICK RACE</button>
      <div class="row2">
        <button id="btnNew" class="btn" type="button">NEW ROOM</button>
        <button id="btnSolo" class="btn" type="button">SOLO RUN</button>
      </div>
      <div class="joinrow">
        <input id="joinCode" type="text" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ROOM CODE" aria-label="Room code">
        <button id="btnJoin" class="btn" type="button">JOIN</button>
      </div>
      <p class="hint">Race rivals across the garden, barnyard, driveway and kitchen. First across wins.</p>
    </div>
  </section>

  <section id="lobby" class="screen" hidden>
    <div class="panel">
      <div class="field">ROOM CODE</div>
      <div id="roomCode" class="code">----</div>
      <div class="row2">
        <button id="btnShare" class="btn" type="button">INVITE</button>
        <button id="btnLeave" class="btn" type="button">LEAVE</button>
      </div>
      <div class="hazard"></div>
      <div class="field">HOPPERS <span id="lobbyCount"></span></div>
      <ul id="roster"></ul>
      <p id="lobbyNote" class="hint">The race starts when every hopper is ready.</p>
      <button id="btnReady" class="btn primary" type="button">READY</button>
    </div>
  </section>

  <section id="results" class="screen" hidden>
    <div class="panel">
      <div class="field" id="resTitle">RESULTS</div>
      <div id="resHead" class="reshead">ROUND</div>
      <div class="hazard"></div>
      <ol id="resList"></ol>
      <p id="resNext" class="hint"></p>
      <button id="btnNext" class="btn primary" type="button">READY FOR NEXT</button>
      <div class="row2">
        <button id="btnResLeave" class="btn" type="button">LEAVE</button>
      </div>
    </div>
  </section>

  <div id="toast" role="status"></div>
</div>

<script src="sprites.js"></script>
<script src="game.js"></script>
</body>
</html>
